# Optional CI for compilation and JVM tests. No CI provider is mandatory to develop the app.
name: Android build checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile debug and run JVM unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload test APK (restricted alpha; not for public use)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: civicrelay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
